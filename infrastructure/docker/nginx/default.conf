# SentinelX web server (nginx-unprivileged, listens on 8080).

server_tokens off;

upstream sentinelx_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Prometheus metrics are for the internal network only (scraped from the api
    # container); never publish them through the web tier.
    location = /metrics {
        return 404;
    }

    # API reverse proxy (same-origin for the SPA). The API sets its own,
    # stricter security headers, so none are added here.
    location /api/ {
        proxy_pass http://sentinelx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Fingerprinted build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback: unknown paths are handled by the client-side router.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
