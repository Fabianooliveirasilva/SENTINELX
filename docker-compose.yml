# SentinelX local development / evaluation stack.
#
#   make env      # generate .env with random secrets (first time only)
#   make up       # build and start everything
#   make admin    # create the first administrator
#   open http://localhost:8080
#
# Network design:
#   backend     (internal: no outbound internet) -> postgres, redis, migrate, api, worker, scanner
#   frontend    (bridge, 172.30.10.0/24)          -> web (fixed IP), api
#   scan-egress (bridge, outbound)                -> scanner, scanner-zap (the only containers
#               that talk to scan targets; no database credentials or secret key)
#   zap-net     (internal: no outbound)           -> zap, scanner-zap. ZAP's ONLY route out is
#               the egress guard inside scanner-zap, which admits the authorized
#               origin only and connects to the scope engine's pinned addresses.
# Only the web (8080) and API (8000) ports are published, and only on 127.0.0.1.

name: sentinelx

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *hardening
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  image: sentinelx/api:dev
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  environment: &app-env
    SENTINELX_ENVIRONMENT: ${SENTINELX_ENVIRONMENT:-development}
    SENTINELX_LOG_LEVEL: ${SENTINELX_LOG_LEVEL:-INFO}
    SENTINELX_LOG_JSON: "true"
    SENTINELX_SECRET_KEY: ${SENTINELX_SECRET_KEY:?set SENTINELX_SECRET_KEY in .env (run make env)}
    SENTINELX_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelx}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sentinelx}
    SENTINELX_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    SENTINELX_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    SENTINELX_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    SENTINELX_ALLOWED_HOSTS: localhost,127.0.0.1,api
    SENTINELX_CORS_ALLOWED_ORIGINS: ${SENTINELX_CORS_ALLOWED_ORIGINS:-}
    SENTINELX_FRONTEND_BASE_URL: ${SENTINELX_FRONTEND_BASE_URL:-http://localhost:8080}
    SENTINELX_EMAIL_BACKEND: ${SENTINELX_EMAIL_BACKEND:-console}
    SENTINELX_ALLOW_SELF_REGISTRATION: ${SENTINELX_ALLOW_SELF_REGISTRATION:-false}
    SENTINELX_SCOPE_LAB_NETWORKS: ${SENTINELX_SCOPE_LAB_NETWORKS:-}
    SENTINELX_SCOPE_LAB_DOMAINS: ${SENTINELX_SCOPE_LAB_DOMAINS:-}

services:
  postgres:
    <<: *hardening
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    <<: *hardening
    image: redis:7.4.12-alpine3.22
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --protected-mode yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320M }

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *app-env
      # Trust X-Forwarded-For only from the Nginx container, so client IPs used for
      # rate limiting and audit logs cannot be spoofed by direct callers.
      FORWARDED_ALLOW_IPS: 172.30.10.10
    ports:
      - "127.0.0.1:8000:8000"
    networks: [backend, frontend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    <<: *app
    command:
      - celery
      - -A
      - sentinelx_workers.celery_app:celery_app
      - worker
      - --queues=celery,orchestrator
      - --beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO
      - --concurrency=2
      - --without-gossip
      - --without-mingle
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A sentinelx_workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  scanner:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/scanner.Dockerfile
    image: sentinelx/scanner:dev
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    # Deliberately minimal: broker access and scope tuning only. No database URL,
    # no secret key. Scope is re-evaluated here with fresh DNS before every scan.
    environment:
      SENTINELX_LOG_LEVEL: ${SENTINELX_LOG_LEVEL:-INFO}
      SENTINELX_LOG_JSON: "true"
      SENTINELX_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/1
      SENTINELX_SCOPE_LAB_NETWORKS: ${SENTINELX_SCOPE_LAB_NETWORKS:-}
      SENTINELX_SCOPE_LAB_DOMAINS: ${SENTINELX_SCOPE_LAB_DOMAINS:-}
      SENTINELX_PASSIVE_SOURCES_ENABLED: ${SENTINELX_PASSIVE_SOURCES_ENABLED:-true}
    networks: [backend, scan-egress]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A sentinelx_workers.scanner_app:scanner_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 256 }

  # ZAP scans run one at a time on their own queue: the ZAP daemon holds a single
  # session. This worker hosts the egress guard ZAP must use (port 8899).
  scanner-zap:
    <<: *hardening
    image: sentinelx/scanner:dev
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    command:
      - celery
      - -A
      - sentinelx_workers.scanner_app:scanner_app
      - worker
      - --queues=scans.zap
      - --concurrency=1
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
    environment:
      SENTINELX_LOG_LEVEL: ${SENTINELX_LOG_LEVEL:-INFO}
      SENTINELX_LOG_JSON: "true"
      SENTINELX_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/1
      SENTINELX_SCOPE_LAB_NETWORKS: ${SENTINELX_SCOPE_LAB_NETWORKS:-}
      SENTINELX_SCOPE_LAB_DOMAINS: ${SENTINELX_SCOPE_LAB_DOMAINS:-}
      SENTINELX_ZAP_API_URL: http://zap:8080
      SENTINELX_ZAP_API_KEY: ${ZAP_API_KEY:?set ZAP_API_KEY in .env (run make env)}
      SENTINELX_ZAP_PROXY_HOST: scanner-zap
      SENTINELX_ZAP_PROXY_PORT: "8899"
    networks: [backend, scan-egress, zap-net]
    depends_on:
      redis: { condition: service_healthy }
      zap: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A sentinelx_workers.scanner_app:scanner_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 256 }

  # OWASP ZAP daemon: no route to the internet or the backend network.
  zap:
    <<: *hardening
    image: zaproxy/zap-stable:2.17.0
    command:
      - zap.sh
      - -daemon
      - -silent
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=${ZAP_API_KEY:?set ZAP_API_KEY in .env (run make env)}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/zap/.ZAP:size=512m,uid=1000,gid=1000
    cap_drop: [ALL]
    networks: [zap-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2G, pids: 512 }

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    image: sentinelx/web:dev
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      frontend:
        ipv4_address: 172.30.10.10
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

networks:
  backend:
    internal: true
  scan-egress:
    driver: bridge
  zap-net:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  postgres-data: {}
  redis-data: {}
