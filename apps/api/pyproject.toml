[project]
name = "sentinelx-api"
version = "0.1.0"
description = "SentinelX REST API (FastAPI modular monolith)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.162.4,<0.163",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.2,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.1,<2",
    "redis>=8.1.0,<9",
    "structlog>=26.1.0,<27",
    "httpx>=0.28.1,<0.29",
    "argon2-cffi>=25.1.0,<26",
    "pyjwt>=2.15.1,<3",
    "email-validator>=2.3.0,<3",
    "sentinelx-security",
    "celery[redis]>=5.7.0,<5.8",
    "cryptography>=50.0.2,<51",
    "anthropic>=1,<2",
]

[project.scripts]
sentinelx-admin = "app.cli:main"

[tool.uv.sources]
sentinelx-security = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
