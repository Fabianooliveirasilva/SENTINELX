[project]
name = "sentinelx-security"
version = "0.4.0"
description = "SentinelX security engine: scope enforcement and (later) scanner adapters."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "dnspython>=2.9.2,<3",
    "idna>=3.20,<4",
    "cryptography>=50.0.2,<51",
    "defusedxml>=0.7.1,<0.8",
    "httpx>=0.28.1,<0.29",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinelx_security"
module-root = ""
