name: Containers

# Builds the images, scans them, boots the full docker compose stack and runs
# the Playwright smoke suite against it. Runs on main and for PRs that touch
# container or dependency definitions.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "infrastructure/**"
      - "docker-compose.yml"
      - "uv.lock"
      - "apps/web/pnpm-lock.yaml"
      - ".github/workflows/containers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-smoke:
    name: Build · scan · compose smoke · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          tags: sentinelx/api:dev
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          tags: sentinelx/web:dev
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trivy image scan (fail on fixable CRITICAL)
        run: |
          for image in sentinelx/api:dev sentinelx/web:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
              image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$image"
          done

      - name: Generate ephemeral .env
        run: python3 scripts/generate_env.py

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Readiness through Nginx
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Worker consumes a task
        run: |
          docker compose exec -T worker python -c "
          from sentinelx_workers.tasks.system import ping
          result = ping.delay().get(timeout=30)
          assert result['status'] == 'ok', result
          print(result)
          "

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Playwright E2E
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EXPECT_OPERATIONAL: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
