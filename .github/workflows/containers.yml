name: Containers

# Builds the images, scans them, boots the full docker compose stack and runs
# the Playwright smoke suite against it. Runs on main, on every push to a phase
# branch (feat/**), and for PRs that touch container or dependency definitions.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "infrastructure/**"
      - "docker-compose.yml"
      - "uv.lock"
      - "apps/web/pnpm-lock.yaml"
      - ".github/workflows/containers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-smoke:
    name: Build · scan · compose smoke · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Generated first so that diagnostic/teardown steps can always interpolate
      # docker-compose.yml, even when an earlier step fails.
      - name: Generate ephemeral .env
        run: python3 scripts/generate_env.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          tags: sentinelx/api:dev
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build scanner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/scanner.Dockerfile
          tags: sentinelx/scanner:dev
          load: true
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          tags: sentinelx/web:dev
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trivy image scan (fail on fixable CRITICAL)
        run: |
          status=0
          for image in sentinelx/api:dev sentinelx/scanner:dev sentinelx/web:dev; do
            report="$RUNNER_TEMP/trivy-$(echo "$image" | tr '/:' '--').json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:$RUNNER_TEMP" \
              aquasec/trivy:0.76.2 image --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed \
              --no-progress --format json --output "$report" "$image" 2>"$report.stderr" || {
                status=1
                python3 scripts/ci/annotate_failure.py trivy "$report"
              }
          done
          exit $status

      - name: Start stack
        run: |
          set -o pipefail
          docker compose config --quiet 2>&1 | tee "$RUNNER_TEMP/compose.log"
          docker compose up -d --no-build --wait --wait-timeout 180 2>&1 | tee -a "$RUNNER_TEMP/compose.log"

      - name: Readiness through Nginx
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Worker consumes a task
        run: |
          docker compose exec -T worker python -c "
          from sentinelx_workers.tasks.system import ping
          result = ping.delay().get(timeout=30)
          assert result['status'] == 'ok', result
          print(result)
          "

      - name: Scanner sandbox is isolated and ready
        run: |
          docker compose exec -T scanner sh -c 'test -z "$SENTINELX_DATABASE_URL" && test -z "$SENTINELX_SECRET_KEY"'
          docker compose exec -T scanner nmap --version | head -1
          docker compose exec -T scanner celery -A sentinelx_workers.scanner_app:scanner_app \
            inspect registered --timeout 10 | grep -q sentinelx.scans.execute
          docker compose exec -T worker celery -A sentinelx_workers.celery_app:celery_app \
            inspect active_queues --timeout 10 | grep -q orchestrator
          docker compose exec -T scanner nuclei -version 2>&1 | tail -1
          docker compose exec -T scanner-zap celery -A sentinelx_workers.scanner_app:scanner_app \
            inspect active_queues --timeout 10 | grep -q scans.zap

      - name: ZAP is reachable only through the egress guard
        run: |
          # Output is kept for the failure annotation (job logs need admin access).
          exec > >(tee "$RUNNER_TEMP/zapcheck.log") 2>&1
          # The ZAP container has no route to the internet (internal network only).
          if docker compose exec -T zap bash -c 'exec 3<>/dev/tcp/1.1.1.1/443'; then
            echo "ZAP reached the internet directly" >&2; exit 1
          fi
          echo "ok: zap has no direct route to the internet"
          docker compose exec -T scanner-zap python -c "
          import os, httpx
          key = os.environ['SENTINELX_ZAP_API_KEY']
          url = 'http://zap:8080/JSON/core/view/version/'
          r = httpx.get(url, headers={'X-ZAP-API-Key': key}, timeout=10)
          print('with key:', r.status_code, r.text[:200])
          r.raise_for_status()
          r = httpx.get(url, timeout=10)
          print('without key:', r.status_code, r.text[:200])
          assert r.status_code in (400, 401, 403), r.status_code
          "

      # The throwaway credential only ever lives in a runner temp file: it is never
      # echoed, masked or exported, so it cannot appear in logs.
      - name: Bootstrap an administrator for E2E
        run: |
          umask 077
          python3 -c 'import secrets; print(secrets.token_urlsafe(24), end="")' > "$RUNNER_TEMP/e2e-admin"
          docker compose exec -T -e SENTINELX_BOOTSTRAP_ADMIN_PASSWORD="$(cat "$RUNNER_TEMP/e2e-admin")" api \
            sentinelx-admin create-admin --email admin@sentinelx.example.com --full-name "CI Admin"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Playwright E2E
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EXPECT_OPERATIONAL: "1"
          E2E_ADMIN_EMAIL: admin@sentinelx.example.com
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          E2E_ADMIN_PASSWORD="$(cat "$RUNNER_TEMP/e2e-admin")" pnpm test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Container diagnostics on failure
        if: failure()
        run: |
          python3 scripts/ci/annotate_failure.py file "compose" "$RUNNER_TEMP/compose.log"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' > "$RUNNER_TEMP/images.txt"
          python3 scripts/ci/annotate_failure.py file "images" "$RUNNER_TEMP/images.txt"
          sleep 1
          python3 scripts/ci/annotate_failure.py file "zap check" "$RUNNER_TEMP/zapcheck.log"
          python3 scripts/ci/annotate_failure.py containers

      - name: Compose logs on failure
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        continue-on-error: true
        run: docker compose down -v
