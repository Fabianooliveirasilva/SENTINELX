name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  # Exact patch release, matching the runtime image: stdlib behaviour that the
  # scope engine relies on (ipaddress) changes between 3.12.x releases.
  PYTHON_VERSION: "3.12.16"
  UV_PYTHON_PREFERENCE: only-managed
  NODE_VERSION: "24"
  UV_FROZEN: "1"

jobs:
  backend-quality:
    name: Backend · lint & types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy apps/api/app apps/api/tests apps/api/migrations workers security-engine

  backend-tests:
    name: Backend · unit & API tests (no infrastructure)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest

  backend-integration:
    name: Backend · full suite + coverage gate (PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: sentinelx
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.22
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SENTINELX_ENVIRONMENT: test
      SENTINELX_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000000
      SENTINELX_DATABASE_URL: postgresql+asyncpg://sentinelx:ci-only-password@127.0.0.1:5432/sentinelx
      SENTINELX_REDIS_URL: redis://127.0.0.1:6379/0
      SENTINELX_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Verify models and migrations are in sync
        working-directory: apps/api
        run: uv run alembic check
      - name: Verify downgrade/upgrade round trip
        working-directory: apps/api
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: Full test suite with coverage gate
        run: uv run pytest -m "" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  security:
    name: Security · secrets, SAST, dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - name: Bandit (Python SAST)
        run: uv run bandit -c pyproject.toml -r apps/api/app workers/sentinelx_workers security-engine/sentinelx_security
      - name: pip-audit (Python dependencies)
        run: |
          uv export --all-packages --no-dev --no-emit-workspace --format requirements.txt -o "$RUNNER_TEMP/requirements.txt" -q
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Semgrep (multi-language SAST)
        run: |
          uvx --from semgrep==1.185.0 semgrep scan --error --metrics=off \
            --config p/python --config p/typescript --config p/react \
            --config p/dockerfile --config p/github-actions --config p/secrets \
            --exclude apps/web/node_modules
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (frontend dependencies)
        working-directory: apps/web
        run: pnpm audit --audit-level high
